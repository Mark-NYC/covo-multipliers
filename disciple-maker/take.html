<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DXGLXDTF9V"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-DXGLXDTF9V');
    </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disciple Maker Next Step</title>
    <link rel="icon" type="image/x-icon" href="/image/favicons/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/image/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/image/favicons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/image/favicons/apple-touch-icon.png">
    <link rel="manifest" href="/image/favicons/site.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <script src="config.js"></script>
  <script src="questions.js"></script>
  <style>
    body { background: #fafaf8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1a1a1a; }

    /* Header + slim progress */
    .dm-header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(250,250,248,0.95); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(27,77,62,0.08);
    }
    .dm-header-inner {
      max-width: 600px; margin: 0 auto; padding: 12px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .dm-header-brand { font-size: 13px; font-weight: 700; letter-spacing: 0.4px; color: #1b4d3e; text-decoration: none; }
    .dm-header-progress { font-size: 12px; font-weight: 600; color: #5a6b65; }
    .progress-track { height: 3px; background: #e7eeea; }
    .progress-fill { height: 3px; width: 0%; background: linear-gradient(90deg, #1b4d3e, #2d6a4f); transition: width 0.35s ease; }

    .dm-main { max-width: 600px; margin: 0 auto; padding: 40px 24px 64px; }

    .q-eyebrow {
      font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
      color: #9f7a2f; margin-bottom: 12px;
    }
    .q-text {
      font-size: clamp(21px, 5vw, 26px); font-weight: 800; line-height: 1.28;
      letter-spacing: -0.01em; color: #10281f; margin: 0 0 28px;
    }
    .q-sub { font-size: 15px; line-height: 1.6; color: #52645d; margin: -16px 0 28px; }

    .options { display: flex; flex-direction: column; gap: 12px; }
    .option {
      display: block; width: 100%; text-align: left;
      background: #ffffff; border: 1.5px solid #dbe8e2; border-radius: 14px;
      padding: 17px 20px; font-size: 16px; line-height: 1.45; font-family: inherit; color: #1a1a1a;
      cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
    }
    .option:hover { border-color: #1b4d3e; background: #f6faf8; }
    .option:focus-visible { outline: 3px solid #dcb55a; outline-offset: 2px; }
    .option.selected { border-color: #1b4d3e; background: #eef5f1; box-shadow: inset 0 0 0 1px #1b4d3e; }

    .q-note {
      width: 100%; min-height: 96px; padding: 14px 16px; font-family: inherit; font-size: 16px;
      color: #1a1a1a; border: 1.5px solid #dbe8e2; border-radius: 14px; resize: vertical; box-sizing: border-box;
    }
    .q-note:focus { outline: none; border-color: #1b4d3e; box-shadow: 0 0 0 3px rgba(27,77,62,0.1); }

    .nav-row { display: flex; align-items: center; justify-content: space-between; margin-top: 32px; }
    .btn-back {
      background: none; border: none; font-family: inherit; font-size: 15px; font-weight: 600;
      color: #5f746c; cursor: pointer; padding: 8px 4px;
    }
    .btn-back:hover { color: #1b4d3e; }
    .btn-back:disabled { opacity: 0; pointer-events: none; }
    .btn-primary {
      background: #1b4d3e; color: #fff; border: none; border-radius: 10px;
      padding: 13px 26px; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
    }
    .btn-primary:hover:not(:disabled) { background: #10281f; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

    .save-row { margin-top: 28px; display: flex; align-items: center; justify-content: space-between; }
    .save-indicator { font-size: 12px; color: #8a9a93; }
    .save-exit { background: none; border: none; font-family: inherit; font-size: 13px; font-weight: 600; color: #5f746c; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
    .save-exit:hover { color: #1b4d3e; }

    .loading-state { text-align: center; padding: 64px 20px; }
    .spinner { width: 38px; height: 38px; border: 3px solid #e7eeea; border-top-color: #1b4d3e; border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-state p { color: #52645d; font-size: 15px; }

    .fade { animation: fade 0.28s ease-out; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 480px) {
      .dm-main { padding: 32px 20px 56px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .fade, .progress-fill { animation: none; transition: none; }
    }
  </style>
  <script src="/utm-tracking.js"></script>
</head>
<body>

  <header class="dm-header">
    <div class="dm-header-inner">
      <a class="dm-header-brand" href="/">CoVo Multipliers</a>
      <span class="dm-header-progress" id="header-progress">Loading…</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </header>

  <main class="dm-main">

    <div id="step-view"></div>

    <div id="submitting-view" class="loading-state" style="display:none;">
      <div class="spinner"></div>
      <p>Finding your next step…</p>
    </div>

    <div id="error-view" class="loading-state" style="display:none;">
      <p id="error-msg" style="color:#b91c1c;">Something went wrong.</p>
      <button class="btn-primary" style="margin-top:16px;" onclick="location.reload()">Try again</button>
    </div>

  </main>

  <script>
    const SUPABASE_FUNCTIONS = window.DISCIPLE_MAKER_CONFIG.SUPABASE_FUNCTIONS;

    // --- session credentials (supports ?s=&t= resume links) ---------------
    (function getCredentials() {
      const params = new URLSearchParams(window.location.search);
      const s = params.get('s'), t = params.get('t');
      if (s && t) {
        sessionStorage.setItem('dm_session_id', s);
        sessionStorage.setItem('dm_session_token', t);
        history.replaceState({}, '', window.location.pathname);
      }
    })();

    const sessionId = sessionStorage.getItem('dm_session_id');
    const sessionToken = sessionStorage.getItem('dm_session_token');
    if (!sessionId || !sessionToken) {
      window.location.replace('/disciple-maker/intake.html');
    }

    // --- state ------------------------------------------------------------
    let answers = {};
    let chosenOutcome = null;
    let note = '';
    let stepIndex = 0;

    try {
      const saved = sessionStorage.getItem('dm_answers');
      if (saved) answers = JSON.parse(saved) || {};
    } catch (_) { answers = {}; }

    function track(event, detail) {
      try { gtag('event', event, Object.assign({ tool: 'disciple_maker_next_step' }, detail || {})); } catch (_) {}
      // Best-effort server persistence for the admin funnel (non-blocking).
      try {
        fetch(`${SUPABASE_FUNCTIONS}/disciple-maker-event`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          keepalive: true,
          body: JSON.stringify({ session_id: sessionId, event, detail: detail || null }),
        }).catch(() => {});
      } catch (_) {}
    }

    // Steps = active questions (respecting branching) + confirm + note.
    function steps() {
      const qs = NEXT_STEP.activeQuestions(answers);
      return [
        ...qs.map(q => ({ kind: 'question', q })),
        { kind: 'confirm' },
        { kind: 'note' },
      ];
    }

    function totalSteps() { return steps().length; }

    function updateProgress() {
      const total = totalSteps();
      const pct = Math.min(100, Math.round((stepIndex) / total * 100));
      document.getElementById('progress-fill').style.width = pct + '%';
      document.getElementById('header-progress').textContent = `Step ${Math.min(stepIndex + 1, total)} of ${total}`;
    }

    function saveProgress() {
      sessionStorage.setItem('dm_answers', JSON.stringify(answers));
      const el = document.getElementById('save-indicator');
      if (el) { el.textContent = 'Saved'; setTimeout(() => { if (el) el.textContent = 'Your progress is saved automatically'; }, 1200); }
    }

    function render() {
      const all = steps();
      if (stepIndex >= all.length) stepIndex = all.length - 1;
      if (stepIndex < 0) stepIndex = 0;
      const step = all[stepIndex];
      const view = document.getElementById('step-view');

      if (step.kind === 'question') return renderQuestion(view, step.q);
      if (step.kind === 'confirm') return renderConfirm(view);
      if (step.kind === 'note') return renderNote(view);
    }

    function optionButton(label, selected, onClick) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'option' + (selected ? ' selected' : '');
      b.textContent = label;
      b.onclick = onClick;
      return b;
    }

    function shell(view, inner) {
      view.className = 'fade';
      view.innerHTML = inner;
    }

    function renderQuestion(view, q) {
      shell(view, `
        <div class="q-eyebrow">${q.eyebrow}</div>
        <h1 class="q-text">${q.text}</h1>
        <div class="options" id="options"></div>
        ${navAndSave()}
      `);
      const opts = view.querySelector('#options');
      q.options.forEach(o => {
        const btn = optionButton(o.label, answers[q.id] === o.value, () => {
          answers[q.id] = o.value;
          opts.querySelectorAll('.option').forEach(x => x.classList.remove('selected'));
          btn.classList.add('selected');
          // Branching may add/remove later steps; drop a now-invalid q7 answer.
          if (!NEXT_STEP.activeQuestions(answers).some(x => x.id === 'q7_stalled')) delete answers.q7_stalled;
          saveProgress();
          track('question_answered', { question_id: q.id, value: o.value });
          advance();
        });
        opts.appendChild(btn);
      });
      wireNav();
      updateProgress();
    }

    function renderConfirm(view) {
      const candidates = NEXT_STEP.candidateOutcomes(answers);
      shell(view, `
        <div class="q-eyebrow">One last check</div>
        <h1 class="q-text">Which of these sounds more like where you actually are?</h1>
        <p class="q-sub">There's no wrong answer. Pick the one that feels most honest — it shapes the next step you'll get.</p>
        <div class="options" id="options"></div>
        ${navAndSave()}
      `);
      const opts = view.querySelector('#options');
      candidates.forEach(key => {
        const o = NEXT_STEP.outcomes[key];
        const btn = optionButton('“' + o.statement + '”', chosenOutcome === key, () => {
          chosenOutcome = key;
          opts.querySelectorAll('.option').forEach(x => x.classList.remove('selected'));
          btn.classList.add('selected');
          track('recognition_confirmed', { outcome: key });
          advance();
        });
        opts.appendChild(btn);
      });
      wireNav();
      updateProgress();
    }

    function renderNote(view) {
      shell(view, `
        <div class="q-eyebrow">Optional</div>
        <h1 class="q-text">In one sentence — what do you think is actually getting in the way?</h1>
        <p class="q-sub">Totally optional. It just helps you name it (and you can skip straight to your next step).</p>
        <textarea class="q-note" id="note" placeholder="e.g., I keep learning but never actually start…">${note ? note.replace(/</g,'&lt;') : ''}</textarea>
        <div class="nav-row">
          <button class="btn-back" id="back-btn">← Back</button>
          <button class="btn-primary" id="finish-btn">See my next step →</button>
        </div>
        ${saveRow()}
      `);
      view.querySelector('#note').addEventListener('input', e => { note = e.target.value; });
      view.querySelector('#back-btn').onclick = goBack;
      view.querySelector('#finish-btn').onclick = submit;
      wireSaveExit();
      updateProgress();
    }

    function navAndSave() {
      return `
        <div class="nav-row">
          <button class="btn-back" id="back-btn" ${stepIndex === 0 ? 'disabled' : ''}>← Back</button>
          <span></span>
        </div>
        ${saveRow()}
      `;
    }
    function saveRow() {
      return `
        <div class="save-row">
          <span class="save-indicator" id="save-indicator">Your progress is saved automatically</span>
          <button class="save-exit" id="save-exit">Save &amp; exit</button>
        </div>
      `;
    }
    function wireNav() {
      const back = document.getElementById('back-btn');
      if (back) back.onclick = goBack;
      wireSaveExit();
    }
    function wireSaveExit() {
      const ex = document.getElementById('save-exit');
      if (ex) ex.onclick = () => { saveProgress(); window.location.replace('/disciple-maker/'); };
    }

    function advance() {
      // brief, calm delay so the selection is visible — no confetti.
      setTimeout(() => { stepIndex++; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }, 220);
    }
    function goBack() { if (stepIndex > 0) { stepIndex--; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); } }

    async function submit() {
      showSubmitting(true);
      track('completed', { outcome: chosenOutcome });
      try {
        const res = await fetch(`${SUPABASE_FUNCTIONS}/disciple-maker-submit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            session_id: sessionId,
            session_token: sessionToken,
            answers,
            recognition_outcome: chosenOutcome,
            note: (note || '').slice(0, 500),
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to save.');
        sessionStorage.removeItem('dm_answers');
        window.location.replace(`/disciple-maker/results.html?r=${data.results_token}`);
      } catch (err) {
        showSubmitting(false);
        document.getElementById('error-view').style.display = 'block';
        document.getElementById('step-view').style.display = 'none';
        document.getElementById('error-msg').textContent = err.message;
      }
    }

    function showSubmitting(on) {
      document.getElementById('submitting-view').style.display = on ? 'block' : 'none';
      document.getElementById('step-view').style.display = on ? 'none' : 'block';
    }

    render();
  </script>

</body>
</html>
