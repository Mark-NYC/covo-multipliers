<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DXGLXDTF9V"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-DXGLXDTF9V');
    </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Next Step — Disciple Maker</title>
    <link rel="icon" type="image/x-icon" href="/image/favicons/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/image/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/image/favicons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/image/favicons/apple-touch-icon.png">
    <link rel="manifest" href="/image/favicons/site.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <script src="config.js"></script>
  <style>
    body { background: #fafaf8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1a1a1a; }
    .dm-header { position: sticky; top: 0; z-index: 50; background: rgba(250,250,248,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(27,77,62,0.08); }
    .dm-header-inner { max-width: 620px; margin: 0 auto; padding: 12px 24px; }
    .dm-header-brand { font-size: 13px; font-weight: 700; letter-spacing: 0.4px; color: #1b4d3e; text-decoration: none; }

    .dm-main { max-width: 620px; margin: 0 auto; padding: 40px 24px 72px; }

    .loading-state { text-align: center; padding: 72px 20px; }
    .spinner { width: 38px; height: 38px; border: 3px solid #e7eeea; border-top-color: #1b4d3e; border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-state p { color: #52645d; font-size: 15px; }

    .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #9f7a2f; margin-bottom: 14px; }

    /* [1] recognition headline */
    .headline { font-size: clamp(26px, 6.5vw, 36px); font-weight: 900; line-height: 1.12; letter-spacing: -0.02em; color: #10281f; margin: 0 0 20px; }
    /* [2] body */
    .body-copy { font-size: 17px; line-height: 1.7; color: #33413b; margin: 0 0 22px; }
    /* [3] what this is not */
    .not-this { background: #f3f7f5; border: 1px solid #e2eae6; border-radius: 14px; padding: 18px 20px; font-size: 15.5px; line-height: 1.65; color: #3a4f47; margin: 0 0 34px; }
    .not-this strong { color: #1b4d3e; }

    .rule { border: none; border-top: 1px solid #e3ebe7; margin: 34px 0; }

    /* [4] this week */
    .step-eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #1b4d3e; margin-bottom: 10px; }
    .step-text { font-size: 20px; font-weight: 750; line-height: 1.4; color: #10281f; margin: 0 0 10px; }
    .step-why { font-size: 14.5px; line-height: 1.6; color: #62726b; margin: 0 0 8px; }
    .step-accept { display: inline-flex; align-items: center; gap: 9px; margin-top: 6px; background: none; border: none; font-family: inherit; font-size: 14px; font-weight: 700; color: #1b4d3e; cursor: pointer; padding: 6px 0; }
    .step-check { width: 20px; height: 20px; border: 2px solid #1b4d3e; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; }
    .step-accept.on .step-check { background: #1b4d3e; }

    /* [5] human loop */
    .human { background: #ffffff; border: 1px solid #e2eae6; border-radius: 16px; padding: 22px; box-shadow: 0 8px 24px rgba(16,40,31,0.05); margin: 34px 0; }
    .human h3 { font-size: 17px; font-weight: 800; color: #10281f; margin: 0 0 6px; }
    .human p { font-size: 14.5px; line-height: 1.6; color: #52645d; margin: 0 0 14px; }
    .human-name { width: 100%; padding: 12px 14px; border: 1.5px solid #c5d5cd; border-radius: 10px; font-size: 15px; font-family: inherit; box-sizing: border-box; }
    .human-name:focus { outline: none; border-color: #1b4d3e; box-shadow: 0 0 0 3px rgba(27,77,62,0.1); }
    .human-msg { width: 100%; min-height: 108px; margin-top: 12px; padding: 12px 14px; border: 1.5px solid #dbe8e2; border-radius: 10px; font-size: 14.5px; line-height: 1.55; font-family: inherit; color: #33413b; resize: vertical; box-sizing: border-box; background: #f9fbfa; }
    .human-msg:focus { outline: none; border-color: #1b4d3e; box-shadow: 0 0 0 3px rgba(27,77,62,0.1); background:#fff; }
    .share-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .share-btn { flex: 1; min-width: 130px; text-align: center; padding: 12px 14px; border-radius: 10px; font-size: 14px; font-weight: 700; font-family: inherit; text-decoration: none; cursor: pointer; border: 1.5px solid #1b4d3e; color: #1b4d3e; background: #fff; transition: background 0.2s ease, color 0.2s ease; }
    .share-btn:hover { background: #1b4d3e; color: #fff; }
    .share-btn.wa { border-color: #1fa855; color: #128c3e; }
    .share-btn.wa:hover { background: #25D366; color: #fff; border-color:#25D366; }

    /* [6] CTAs */
    .cta-primary { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; background: #1b4d3e; color: #fff; padding: 17px 28px; border-radius: 12px; text-decoration: none; font-weight: 800; font-size: 16.5px; box-shadow: 0 8px 20px rgba(27,77,62,0.18); transition: background 0.2s ease, transform 0.15s ease; box-sizing: border-box; }
    .cta-primary:hover { background: #10281f; transform: translateY(-1px); }
    .cta-primary::after { content: '→'; }
    .cta-secondary { display: block; text-align: center; margin-top: 16px; font-size: 14.5px; font-weight: 700; color: #5f746c; text-decoration: none; }
    .cta-secondary:hover { color: #1b4d3e; text-decoration: underline; text-underline-offset: 2px; }
    .cta-sub { text-align:center; font-size: 13px; color: #8a9a93; margin-top: 20px; }
    .cta-sub a { color: #5f746c; }

    .support { margin-top: 44px; padding-top: 28px; border-top: 1px solid #e3ebe7; }
    .support h4 { font-size: 13px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #9f7a2f; margin: 0 0 10px; }
    .support p { font-size: 14.5px; line-height: 1.7; color: #52645d; margin: 0 0 12px; }

    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: #10281f; color: #fff; padding: 12px 20px; border-radius: 999px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease; z-index: 200; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .fade { animation: fade 0.4s ease-out; }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .fade, .cta-primary, .spinner { animation: none; transition: none; } }

    @media (max-width: 480px) { .dm-main { padding: 32px 20px 64px; } .share-btn { min-width: 0; } }
  </style>
</head>
<body>

  <header class="dm-header">
    <div class="dm-header-inner"><a class="dm-header-brand" href="/">CoVo Multipliers</a></div>
  </header>

  <main class="dm-main">
    <div id="loading-view" class="loading-state"><div class="spinner"></div><p>Loading your next step…</p></div>

    <div id="error-view" class="loading-state" style="display:none;">
      <h2 style="color:#10281f;margin-bottom:8px;">We couldn't find those results</h2>
      <p>This link may have expired or been mistyped.</p>
      <p style="margin-top:12px;"><a href="/disciple-maker/" style="color:#1b4d3e;font-weight:700;text-decoration:none;">Start the Next Step Finder →</a></p>
    </div>

    <div id="result-view" style="display:none;"></div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const SUPABASE_FUNCTIONS = window.DISCIPLE_MAKER_CONFIG.SUPABASE_FUNCTIONS;

    // Per-outcome copy. Keyed to the outcome ids in questions.js.
    const COPY = {
      learning_not_practicing: {
        headline: "You've learned more than you've practiced.",
        body: "Your answers suggest you understand disciple making and genuinely want to act — but it hasn't become something you actually do yet. That's not a commitment problem. It usually just means you need real reps.",
        notThis: "This isn't another framework to learn, and it doesn't mean you're behind. <strong>More information won't move you now — one real rep will.</strong>",
        step: "Pick one person and one simple tool, and use it once before Sunday.",
        why: "Doing it badly still counts. The goal this week is a rep, not a result.",
        cta: { label: "Practice With Other Disciple Makers", href: "/?utm_source=dm_results&utm_medium=cta&utm_campaign=apprenticeship#labs" },
        tool: { label: "Or grab one simple tool to use first", href: "https://obey.tools" },
      },
      intending_not_acting: {
        headline: "The intention is real. It just hasn't hit your calendar.",
        body: "You believe in this and there are people around you — but disciple making is still living in the “someday / whenever” part of your week. Good intentions don't reproduce. Scheduled practice does.",
        notThis: "This isn't about wanting it more or feeling guilty. <strong>You don't need more desire — you need a time and a person on the calendar.</strong>",
        step: "Put one 30-minute disciple-making block on your calendar this week, and tell someone it's there.",
        why: "Naming the time and telling one person is what turns intention into a rep.",
        cta: { label: "Practice With Other Disciple Makers", href: "/?utm_source=dm_results&utm_medium=cta&utm_campaign=apprenticeship#labs" },
        tool: { label: "Or grab one simple tool to use first", href: "https://obey.tools" },
      },
      no_relational_field: {
        headline: "There's no one nearby yet to practice with.",
        body: "Before tools or techniques, disciple making needs people who aren't yet following Jesus in your everyday life. Right now that field is thin — and that's the most fixable thing on the list.",
        notThis: "This isn't a courage problem or a skills problem. <strong>You'd share if someone were there. The gap is proximity, not willingness.</strong>",
        step: "Name five people you already see each week who aren't yet following Jesus, and share the list with a practitioner.",
        why: "You can't practice on people you haven't named. This is where everything else starts.",
        cta: { label: "Learn the How Alongside Practitioners", href: "/?utm_source=dm_results&utm_medium=cta&utm_campaign=apprenticeship#labs" },
        tool: { label: "Or try a tool for everyday conversations", href: "https://obey.tools" },
      },
      started_but_stalled: {
        headline: "You started, hit a wall, and quietly slowed down.",
        body: "You've actually tried this — and then it got awkward, or hard, or unclear, and momentum faded. That's not failure. It's the exact point where almost everyone needs a practitioner, not another resource.",
        notThis: "This isn't a sign you're not cut out for it. <strong>Nearly every fruitful disciple maker stalled here — the ones who kept going had someone beside them.</strong>",
        step: "Tell one practitioner exactly where you got stuck, and ask them to help you take the next rep.",
        why: "Naming the wall to a real person is how you get past it — you don't have to solve it alone.",
        cta: { label: "Stop Trying to Figure This Out Alone", href: "/?utm_source=dm_results&utm_medium=cta&utm_campaign=apprenticeship#labs" },
        tool: { label: "Or revisit a simple tool to lower the friction", href: "https://obey.tools" },
      },
      practicing_alone: {
        headline: "You're doing the work — mostly by yourself.",
        body: "You're actually practicing, following up, and staying at it. The thing most likely to multiply your impact now isn't more effort — it's feedback and people moving in the same direction.",
        notThis: "This isn't a knock on your faithfulness. <strong>You don't need to try harder — you need a room of practitioners and one coach's eyes on your reps.</strong>",
        step: "Bring one real situation you're facing to a room of practitioners this week, and ask for one piece of coaching.",
        why: "Solo practice plateaus. One outside perspective on a live situation is worth ten more solo attempts.",
        cta: { label: "Join the Next Multiplying Lab", href: "/?utm_source=dm_results&utm_medium=cta&utm_campaign=apprenticeship#labs" },
        tool: { label: "Or browse tools to sharpen a specific rep", href: "https://obey.tools" },
      },
      reproducing_widen: {
        headline: "This is becoming a lifestyle. The next step isn't more input.",
        body: "You're practicing consistently, following up, and you've got someone helping you. Honestly, you may not mainly need us. Your next step is to widen — to help someone else start, and to keep sharpening with other practitioners.",
        notThis: "This isn't a finish line, and it isn't a sales pitch. <strong>You're past needing more content — your growth now comes from reproducing what you already do.</strong>",
        step: "Invite one person you're discipling to try leading the next step while you watch and coach.",
        why: "You multiply by handing off, not holding on. Let someone do it — badly is fine — while you're there.",
        cta: { label: "Come Practice — and Help Others", href: "/immersions?utm_source=dm_results&utm_medium=cta&utm_campaign=apprenticeship" },
        tool: { label: "Or share a tool with the person you're coaching", href: "https://obey.tools" },
      },
    };

    let OUTCOME = null, FIRST_NAME = 'friend';

    const params = new URLSearchParams(window.location.search);
    const token = params.get('r');

    function track(event, detail) {
      try { gtag('event', event, Object.assign({ tool: 'disciple_maker_next_step', outcome: OUTCOME }, detail || {})); } catch (_) {}
      try {
        fetch(`${SUPABASE_FUNCTIONS}/disciple-maker-v2-event`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, keepalive: true,
          body: JSON.stringify({ results_token: token, event, detail: detail || null }),
        }).catch(() => {});
      } catch (_) {}
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    function esc(s) { return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    const RECOG_PHRASE = {
      learning_not_practicing: "I've learned more than I've actually practiced",
      intending_not_acting: "I keep meaning to but it never makes it into my week",
      no_relational_field: "I need to get around people who aren't following Jesus yet",
      started_but_stalled: "I started, hit a wall, and slowed down",
      practicing_alone: "I've been doing this mostly on my own",
      reproducing_widen: "I want to help someone else start doing this",
    };
    function defaultMessage(name) {
      const who = name ? name : 'friend';
      return `Hey ${who}, I just worked through a disciple-making next-step tool. It helped me see that ${RECOG_PHRASE[OUTCOME]}. I want to take one real step this week — would you be willing to ask me about it?`;
    }

    function isIOS() { return /iPad|iPhone|iPod/.test(navigator.userAgent || ''); }
    function smsHref(body) {
      const enc = encodeURIComponent(body);
      return isIOS() ? `sms:&body=${enc}` : `sms:?body=${enc}`;
    }
    function waHref(body) { return `https://wa.me/?text=${encodeURIComponent(body)}`; }

    function render() {
      const c = COPY[OUTCOME] || COPY.learning_not_practicing;
      const view = document.getElementById('result-view');
      view.className = 'fade';
      view.innerHTML = `
        <div class="eyebrow">Your next step, ${esc(FIRST_NAME)}</div>
        <h1 class="headline">${c.headline}</h1>
        <p class="body-copy">${c.body}</p>
        <div class="not-this">${c.notThis}</div>

        <hr class="rule">

        <div class="step-eyebrow">This week</div>
        <p class="step-text">${c.step}</p>
        <p class="step-why">${c.why}</p>
        <button class="step-accept" id="step-accept"><span class="step-check" id="step-check">✓</span> <span id="step-accept-label">I'm committing to this</span></button>

        <div class="human">
          <h3>Who will know you committed to this?</h3>
          <p>Real change happens out loud. Name one person and send them a quick note — you can edit it.</p>
          <input class="human-name" id="human-name" type="text" placeholder="A coach, practitioner, or trusted friend" autocomplete="off">
          <textarea class="human-msg" id="human-msg">${esc(defaultMessage(''))}</textarea>
          <div class="share-row">
            <a class="share-btn" id="btn-sms" href="#">Send a text</a>
            <a class="share-btn wa" id="btn-wa" href="#" target="_blank" rel="noopener">WhatsApp</a>
            <button class="share-btn" id="btn-share" type="button">Share…</button>
          </div>
        </div>

        <a class="cta-primary" id="cta-primary" href="${c.cta.href}">${c.cta.label}</a>
        <a class="cta-secondary" id="cta-tool" href="${c.tool.href}" target="_blank" rel="noopener">${c.tool.label}</a>
        <p class="cta-sub">We sent your next step to your email too. <a href="/disciple-maker/">Start over</a></p>

        <div class="support">
          <h4>What "practice with practitioners" actually means</h4>
          <p>CoVo Labs are short, live gatherings where ordinary disciple makers bring real situations, practice one simple tool, and get coached by people who are actually doing it. You don't come to listen — you come to take a rep.</p>
          <p>Technology and tools don't disciple you. People do. This tool just helps you see your next step and take it alongside others.</p>
        </div>
      `;

      const nameEl = view.querySelector('#human-name');
      const msgEl = view.querySelector('#human-msg');
      let userEditedMsg = false;
      msgEl.addEventListener('input', () => { userEditedMsg = true; });
      nameEl.addEventListener('input', () => {
        if (!userEditedMsg) msgEl.value = defaultMessage(nameEl.value.trim());
      });
      let namedFired = false;
      nameEl.addEventListener('change', () => {
        if (nameEl.value.trim() && !namedFired) { namedFired = true; track('human_named', {}); }
      });

      function currentBody() { return msgEl.value || defaultMessage(nameEl.value.trim()); }
      view.querySelector('#btn-sms').addEventListener('click', (e) => {
        e.currentTarget.href = smsHref(currentBody());
        track('share_opened', { channel: 'sms' });
      });
      view.querySelector('#btn-wa').addEventListener('click', (e) => {
        e.currentTarget.href = waHref(currentBody());
        track('share_opened', { channel: 'whatsapp' });
      });
      view.querySelector('#btn-share').addEventListener('click', async () => {
        const body = currentBody();
        track('share_opened', { channel: 'native' });
        if (navigator.share) { try { await navigator.share({ text: body }); } catch (_) {} }
        else { try { await navigator.clipboard.writeText(body); showToast('Copied — paste it to anyone'); } catch (_) { showToast('Select and copy the message above'); } }
      });

      const accept = view.querySelector('#step-accept');
      const acceptLabel = view.querySelector('#step-accept-label');
      accept.addEventListener('click', () => {
        accept.classList.toggle('on');
        const on = accept.classList.contains('on');
        acceptLabel.textContent = on ? "I've committed to this" : "I'm committing to this";
        if (on) track('step_accepted', {});
      });

      view.querySelector('#cta-primary').addEventListener('click', () => track('cta_clicked', { target: 'lab' }));
      view.querySelector('#cta-tool').addEventListener('click', () => track('cta_clicked', { target: 'obey_tools' }));
    }

    async function load() {
      if (!token) return showError();
      try {
        const res = await fetch(`${SUPABASE_FUNCTIONS}/disciple-maker-v2-results?token=${encodeURIComponent(token)}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'not found');
        FIRST_NAME = data.first_name || 'friend';
        // Legacy V1 result link (pre-launch): don't invent a recognition — invite a fresh run.
        if (data.legacy || !COPY[data.recognition_outcome]) return showLegacy();
        OUTCOME = data.recognition_outcome;
        document.getElementById('loading-view').style.display = 'none';
        document.getElementById('result-view').style.display = 'block';
        render();
        track('results_viewed', {});
      } catch (_) { showError(); }
    }
    function showError() {
      document.getElementById('loading-view').style.display = 'none';
      document.getElementById('error-view').style.display = 'block';
    }
    function showLegacy() {
      document.getElementById('loading-view').style.display = 'none';
      const view = document.getElementById('result-view');
      view.style.display = 'block';
      view.className = 'fade';
      view.innerHTML = `
        <div class="eyebrow">Welcome back, ${esc(FIRST_NAME)}</div>
        <h1 class="headline">We've made this simpler.</h1>
        <p class="body-copy">The Disciple Maker Next Step has been rebuilt around one thing: your actual next step. It only takes about three minutes, and it ends with one concrete thing to do this week.</p>
        <a class="cta-primary" href="/disciple-maker/">Find my next step</a>
        <p class="cta-sub" style="margin-top:18px;">It's shorter than last time — and there's no score to read.</p>`;
    }

    load();
  </script>

</body>
</html>
