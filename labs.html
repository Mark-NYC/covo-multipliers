<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DXGLXDTF9V"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-DXGLXDTF9V');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Covo Multipliers lab planner — an at-a-glance view of upcoming and past labs with dates, times, and quick links for leaders.">
    <!-- Unlisted: reachable by direct link only. Keep out of search + sitemap. -->
    <meta name="robots" content="noindex, nofollow">
    <title>Lab Planner — Covo Multipliers</title>
    <link rel="icon" type="image/x-icon" href="/image/favicons/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/image/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/image/favicons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/image/favicons/apple-touch-icon.png">
    <link rel="manifest" href="/image/favicons/site.webmanifest">
    <link rel="stylesheet" href="styles.css">
    <link rel="canonical" href="https://covomultipliers.com/labs">

    <style>
        /* ==============================================
           Lab Planner — an at-a-glance reference view
           for leaders: dates, times, seats, quick links.
        ============================================== */

        :root {
            --ink: #12211b;
            --ink-soft: #47554f;
            --ink-faint: #7a8781;
            --green: #1b4d3e;
            --green-deep: #10281f;
            --line: #e7ece9;
            --line-soft: #eef1ef;
            --paper: #f7f6f2;
            --gold: #7a5515;
        }

        body { background: var(--paper); }

        /* 1. Header ----------------------------------------------------- */
        .site-header {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 0.9rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .site-header .brand {
            font-size: 0.95rem;
            font-weight: 900;
            color: var(--green-deep);
            text-decoration: none;
            letter-spacing: -0.01em;
        }
        .site-header .back-link {
            font-size: 0.85rem;
            color: var(--ink-faint);
            text-decoration: none;
        }
        .site-header .back-link:hover { color: var(--green); }

        /* 2. Page head -------------------------------------------------- */
        .planner {
            max-width: 1080px;
            margin: 0 auto;
            padding: 2.25rem 1.5rem 4rem;
        }
        .planner-head {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            justify-content: space-between;
            gap: 0.75rem 1.5rem;
            margin-bottom: 1.5rem;
        }
        .planner-head .eyebrow {
            margin: 0 0 0.3rem;
            font-size: 0.68rem;
            font-weight: 800;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--green);
        }
        .planner-head h1 {
            margin: 0;
            font-size: clamp(1.6rem, 3.2vw, 2.1rem);
            font-weight: 900;
            letter-spacing: -0.02em;
            color: var(--green-deep);
        }
        .planner-head .sub {
            margin: 0.35rem 0 0;
            font-size: 0.92rem;
            color: var(--ink-soft);
            line-height: 1.5;
            max-width: 46ch;
        }
        .tz-note {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--ink-faint);
            white-space: nowrap;
        }

        /* 3. Toolbar: tabs + search ------------------------------------- */
        .planner-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem 1rem;
            margin-bottom: 1rem;
        }
        .planner-tabs {
            display: inline-flex;
            gap: 0.3rem;
            padding: 0.3rem;
            background: #ffffff;
            border: 1px solid var(--line);
            border-radius: 999px;
            box-shadow: 0 1px 6px rgba(16,40,31,0.05);
        }
        .planner-tab {
            appearance: none;
            border: none;
            background: transparent;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 800;
            color: var(--ink-faint);
            padding: 0.5rem 1.15rem;
            border-radius: 999px;
            transition: background 0.16s ease, color 0.16s ease;
        }
        .planner-tab:hover { color: var(--green); }
        .planner-tab.is-active { background: var(--green); color: #fff; }
        .planner-tab .cnt { font-size: 0.76rem; opacity: 0.72; margin-left: 0.28rem; }

        .planner-search {
            position: relative;
            flex: 0 1 260px;
        }
        .planner-search input {
            width: 100%;
            box-sizing: border-box;
            padding: 0.55rem 0.85rem 0.55rem 2.1rem;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--ink);
            background: #ffffff;
            border: 1px solid var(--line);
            border-radius: 999px;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .planner-search input:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(27,77,62,0.1);
        }
        .planner-search svg {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            width: 15px;
            height: 15px;
            color: var(--ink-faint);
            pointer-events: none;
        }

        /* 4. Rows ------------------------------------------------------- */
        .lab-rows {
            background: #ffffff;
            border: 1px solid var(--line);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 4px 18px rgba(16,40,31,0.05);
        }

        .lab-row {
            display: grid;
            grid-template-columns: 170px minmax(0, 1fr) auto auto;
            align-items: center;
            gap: 1.25rem;
            padding: 1rem 1.25rem;
            border-top: 1px solid var(--line-soft);
        }
        .lab-row:first-child { border-top: none; }
        .lab-row:hover { background: #fafcfb; }
        .lab-row.is-full { opacity: 0.72; }

        /* When */
        .lab-when { line-height: 1.3; }
        .lab-when-date {
            display: block;
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--green);
            letter-spacing: 0.01em;
        }
        .lab-when-time {
            display: block;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--ink-faint);
            margin-top: 0.1rem;
        }

        /* Main */
        .lab-name {
            margin: 0;
            font-size: 1.02rem;
            font-weight: 800;
            line-height: 1.3;
            color: var(--ink);
        }
        .lab-hook {
            margin: 0.2rem 0 0;
            font-size: 0.85rem;
            line-height: 1.45;
            color: var(--ink-soft);
        }

        /* Status */
        .lab-status { justify-self: end; }
        /* NB: styles.css also defines .lab-seats (absolute-positioned, for
           the homepage cards). Reset position/animation so ours flows in
           the row grid instead of pinning to the corner. */
        .lab-seats {
            position: static;
            animation: none;
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.02em;
            padding: 0.24rem 0.7rem;
            border-radius: 999px;
            background: rgba(159,122,47,0.1);
            color: #7a5515;
            border: 1px solid rgba(159,122,47,0.32);
            white-space: nowrap;
        }
        .lab-seats.is-full {
            background: #f3f4f6;
            color: #9ca3af;
            border-color: #e5e7eb;
        }
        .lab-tag {
            display: inline-block;
            font-size: 0.68rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 0.24rem 0.65rem;
            border-radius: 999px;
            background: #eef2f0;
            color: #6b7a73;
            border: 1px solid #e0e6e2;
        }

        /* Links + copy */
        .lab-links {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            justify-self: end;
        }
        .lab-linkgroup {
            display: inline-flex;
            align-items: stretch;
            border: 1px solid var(--line);
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
        }
        .lab-linkbtn {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.82rem;
            font-weight: 800;
            text-decoration: none;
            color: var(--green);
            padding: 0.4rem 0.65rem;
            white-space: nowrap;
            transition: background 0.14s ease;
        }
        .lab-linkbtn:hover { background: #f0f5f3; }
        .lab-linkbtn.is-slides { color: var(--gold); }
        .lab-linkbtn.is-slides:hover { background: #faf4e8; }
        .lab-linkbtn.is-zoom { color: #2563eb; }
        .lab-linkbtn.is-zoom:hover { background: #eef2ff; }
        .lab-linkbtn svg { width: 13px; height: 13px; flex: 0 0 auto; }

        .lab-copybtn {
            appearance: none;
            border: none;
            border-left: 1px solid var(--line);
            background: #fff;
            cursor: pointer;
            padding: 0 0.5rem;
            color: var(--ink-faint);
            display: inline-flex;
            align-items: center;
            transition: background 0.14s ease, color 0.14s ease;
        }
        .lab-copybtn:hover { background: #f0f5f3; color: var(--green); }
        .lab-copybtn.is-copied { color: #1b7a4b; background: #eafaf1; }
        .lab-copybtn svg { width: 14px; height: 14px; }

        /* States */
        .lab-state {
            padding: 2.5rem 1.25rem;
            text-align: center;
            color: var(--ink-faint);
            font-size: 0.95rem;
        }
        .lab-state a { color: var(--green); font-weight: 700; }

        /* 5. Footer note ----------------------------------------------- */
        .planner-foot {
            margin-top: 1.1rem;
            font-size: 0.78rem;
            color: var(--ink-faint);
            text-align: center;
            line-height: 1.5;
        }
        .planner-foot a { color: var(--green); font-weight: 700; text-decoration: none; }
        .planner-foot a:hover { text-decoration: underline; }

        /* 5b. Password gate --------------------------------------------- */
        .gate {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: var(--paper);
        }
        .gate-card {
            width: 100%;
            max-width: 360px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(16,40,31,0.08);
            padding: 1.75rem 1.5rem;
            text-align: center;
        }
        .gate-card .eyebrow {
            margin: 0 0 0.4rem;
            font-size: 0.66rem;
            font-weight: 800;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--green);
        }
        .gate-card h1 {
            margin: 0 0 1.1rem;
            font-size: 1.25rem;
            font-weight: 900;
            letter-spacing: -0.01em;
            color: var(--green-deep);
        }
        .gate-form { display: flex; flex-direction: column; gap: 0.6rem; }
        .gate-form input {
            width: 100%;
            box-sizing: border-box;
            padding: 0.6rem 0.85rem;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--ink);
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 8px;
            outline: none;
        }
        .gate-form input:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(27,77,62,0.1);
        }
        .gate-form button {
            appearance: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 800;
            color: #fff;
            background: var(--green);
            padding: 0.6rem 1rem;
            border-radius: 8px;
            transition: background 0.15s ease;
        }
        .gate-form button:hover { background: var(--green-deep); }
        .gate-error {
            min-height: 1.1rem;
            margin: 0.2rem 0 0;
            font-size: 0.8rem;
            font-weight: 700;
            color: #b91c1c;
        }
        .gate-error:empty { visibility: hidden; }

        /* 6. Responsive ------------------------------------------------- */
        @media (max-width: 760px) {
            .lab-row {
                grid-template-columns: 1fr;
                gap: 0.6rem;
                padding: 1.05rem 1.1rem;
            }
            .lab-when { order: 1; }
            .lab-when-date, .lab-when-time { display: inline; }
            .lab-when-time::before { content: " · "; }
            .lab-main { order: 2; }
            .lab-status { order: 3; justify-self: start; }
            .lab-links { order: 4; justify-self: start; flex-wrap: wrap; }
        }
        @media (max-width: 600px) {
            .site-header { padding: 0.8rem 1.1rem; }
            .planner { padding: 1.75rem 1rem 3rem; }
            .planner-search { flex: 1 1 100%; }
        }
    </style>
</head>
<body>

    <div class="gate" id="gate" hidden>
        <div class="gate-card">
            <p class="eyebrow">Leader Planner</p>
            <h1>Enter password</h1>
            <form class="gate-form" id="gate-form">
                <input type="password" id="gate-input" placeholder="Password" autocomplete="current-password" aria-label="Page password" autofocus>
                <button type="submit">Unlock</button>
                <p class="gate-error" id="gate-error" role="alert"></p>
            </form>
        </div>
    </div>

    <header class="site-header">
        <a class="brand" href="/">Covo Multipliers</a>
        <a class="back-link" href="/">← Back to home</a>
    </header>

    <main class="planner">

        <div class="planner-head">
            <div>
                <p class="eyebrow">Leader Planner</p>
                <h1>Lab Schedule</h1>
                <p class="sub">Every lab at a glance — dates, times, seats, and quick links. Grab a landing page or slide-deck link in one click.</p>
            </div>
            <span class="tz-note">All times shown in ET</span>
        </div>

        <div class="planner-toolbar">
            <div class="planner-tabs" role="tablist" aria-label="Filter labs">
                <button class="planner-tab is-active" role="tab" type="button" aria-selected="true" data-scope="upcoming">
                    Upcoming<span class="cnt" id="cnt-upcoming"></span>
                </button>
                <button class="planner-tab" role="tab" type="button" aria-selected="false" data-scope="past">
                    Past<span class="cnt" id="cnt-past"></span>
                </button>
            </div>

            <div class="planner-search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="search" id="lab-search" placeholder="Filter by lab name…" autocomplete="off" aria-label="Filter labs by name">
            </div>
        </div>

        <div class="lab-rows" id="lab-rows" aria-live="polite">
            <p class="lab-state">Loading labs&hellip;</p>
        </div>

        <p class="planner-foot" id="lab-foot"></p>

    </main>

    <script src="/utm-tracking.js"></script>
    <script>
        // -----------------------------------------------------------------
        // Planning view for leaders. Labs are fetched live from the
        // public-labs Edge Function — the single source of truth for lab
        // data (see supabase/functions/public-labs). Adding a lab, its
        // landing page, or a slide-deck link in Supabase surfaces it here
        // automatically; nothing on this page is hardcoded.
        // -----------------------------------------------------------------
        const SUPABASE_URL = 'https://mryjrvinzbxebzvxtggi.supabase.co';
        const LABS_FEED_URL = `${SUPABASE_URL}/functions/v1/public-labs`;
        const LAB_TIMEZONE = 'America/New_York';
        const PAGE_LIMIT = 100;

        const rowsEl = document.getElementById('lab-rows');
        const footEl = document.getElementById('lab-foot');
        const searchEl = document.getElementById('lab-search');
        const tabs = Array.from(document.querySelectorAll('.planner-tab'));

        // undefined = not fetched, null = failed, array = loaded.
        const cache = { upcoming: undefined, past: undefined };
        let activeScope = 'upcoming';
        let filterText = '';

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        function escapeAttr(str) { return escapeHtml(str); }

        const dateFmt = new Intl.DateTimeFormat('en-US', {
            timeZone: LAB_TIMEZONE, weekday: 'short', month: 'short', day: 'numeric', year: 'numeric',
        });
        const timeFmt = new Intl.DateTimeFormat('en-US', {
            timeZone: LAB_TIMEZONE, hour: 'numeric', minute: '2-digit', timeZoneName: 'short',
        });
        function fmtDate(iso) { return dateFmt.format(new Date(iso)); }
        function fmtTime(iso) { return timeFmt.format(new Date(iso)); }

        const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"></path><path d="M8 7h9v9"></path></svg>';
        const COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg>';
        const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>';

        function linkGroup(href, label, cls, copyLabel) {
            const external = cls === 'is-slides' || cls === 'is-zoom';
            return `
                <span class="lab-linkgroup">
                    <a class="lab-linkbtn ${cls}" href="${escapeAttr(href)}"${external ? ' target="_blank" rel="noopener"' : ''}>
                        <span>${label}</span>${ARROW}
                    </a>
                    <button class="lab-copybtn" type="button" data-copy="${escapeAttr(href)}" aria-label="Copy ${copyLabel} link" title="Copy ${copyLabel} link">${COPY}</button>
                </span>`;
        }

        function labRow(lab, scope) {
            const isPast = scope === 'past';
            const hook = lab.hook || lab.description || '';

            let status;
            if (isPast) {
                status = '<span class="lab-tag">Past</span>';
            } else {
                const isFull = !lab.has_availability;
                status = isFull
                    ? '<span class="lab-seats is-full">Full</span>'
                    : `<span class="lab-seats">${lab.seats_remaining} seat${lab.seats_remaining === 1 ? '' : 's'} left</span>`;
            }

            const pageLink = linkGroup(lab.url, 'Page', '', 'landing page');
            // Zoom join links only matter for upcoming labs and only appear
            // when the feed was asked for them (include_zoom).
            const zoomLink = (!isPast && lab.zoom_link)
                ? linkGroup(lab.zoom_link, 'Join Zoom', 'is-zoom', 'Zoom')
                : '';
            const slidesLink = lab.slides_url ? linkGroup(lab.slides_url, 'Slides', 'is-slides', 'slides') : '';
            const isFullRow = !isPast && !lab.has_availability;

            return `
                <article class="lab-row${isFullRow ? ' is-full' : ''}" data-name="${escapeAttr(String(lab.title).toLowerCase())}">
                    <div class="lab-when">
                        <span class="lab-when-date">${escapeHtml(fmtDate(lab.event_date))}</span>
                        <span class="lab-when-time">${escapeHtml(fmtTime(lab.event_date))}</span>
                    </div>
                    <div class="lab-main">
                        <h3 class="lab-name">${escapeHtml(lab.title)}</h3>
                        ${hook ? `<p class="lab-hook">${escapeHtml(hook)}</p>` : ''}
                    </div>
                    <div class="lab-status">${status}</div>
                    <div class="lab-links">${pageLink}${zoomLink}${slidesLink}</div>
                </article>`;
        }

        function render() {
            const scope = activeScope;
            const labs = cache[scope];

            if (labs === undefined) { rowsEl.innerHTML = '<p class="lab-state">Loading labs&hellip;</p>'; footEl.textContent = ''; return; }
            if (labs === null) { rowsEl.innerHTML = '<p class="lab-state">Couldn&rsquo;t load labs. Please refresh to try again.</p>'; footEl.textContent = ''; return; }
            if (labs.length === 0) {
                rowsEl.innerHTML = scope === 'past'
                    ? '<p class="lab-state">Past labs will appear here as they wrap.</p>'
                    : '<p class="lab-state">No upcoming labs are scheduled yet.</p>';
                footEl.textContent = '';
                return;
            }

            rowsEl.innerHTML = labs.map((lab) => labRow(lab, scope)).join('');
            applyFilter();
        }

        function applyFilter() {
            const q = filterText.trim().toLowerCase();
            const rows = Array.from(rowsEl.querySelectorAll('.lab-row'));
            let shown = 0;
            rows.forEach((row) => {
                const match = !q || row.dataset.name.includes(q);
                row.style.display = match ? '' : 'none';
                if (match) shown++;
            });
            const total = rows.length;
            if (q && shown === 0) {
                footEl.innerHTML = 'No labs match &ldquo;' + escapeHtml(filterText.trim()) + '&rdquo;.';
            } else if (q) {
                footEl.textContent = `Showing ${shown} of ${total} lab${total === 1 ? '' : 's'}.`;
            } else {
                footEl.textContent = `${total} lab${total === 1 ? '' : 's'}.`;
            }
        }

        function updateCount(scope) {
            const labs = cache[scope];
            const el = document.getElementById(`cnt-${scope}`);
            if (el) el.textContent = Array.isArray(labs) && labs.length ? ` (${labs.length})` : '';
        }

        // The password rides as a normal query param (not a custom header) so
        // the cross-origin GET stays a "simple" request with no CORS preflight.
        // The function verifies it against its LABS_PASSWORD secret and only
        // then returns join links; it is never embedded in this page's source.
        function buildFeedUrl(scope, pw) {
            const url = new URL(LABS_FEED_URL);
            url.searchParams.set('scope', scope);
            url.searchParams.set('limit', String(PAGE_LIMIT));
            url.searchParams.set('include_zoom', '1'); // leader planner shows Join Zoom links
            const key = pw !== undefined ? pw : labsPassword;
            if (key) url.searchParams.set('zoom_key', key);
            return url;
        }

        async function loadScope(scope) {
            if (cache[scope] !== undefined) return;
            try {
                const res = await fetch(buildFeedUrl(scope));
                if (res.status === 401) { lock('Session expired. Enter the password again.'); return; }
                if (!res.ok) throw new Error('request failed');
                const data = await res.json();
                cache[scope] = Array.isArray(data.labs) ? data.labs : [];
            } catch { cache[scope] = null; }
            updateCount(scope);
            if (activeScope === scope) render();
        }

        function activateTab(scope) {
            activeScope = scope;
            tabs.forEach((t) => {
                const on = t.dataset.scope === scope;
                t.classList.toggle('is-active', on);
                t.setAttribute('aria-selected', on ? 'true' : 'false');
            });
            render();
            loadScope(scope);
        }

        tabs.forEach((t) => t.addEventListener('click', () => activateTab(t.dataset.scope)));

        searchEl.addEventListener('input', () => {
            filterText = searchEl.value;
            if (Array.isArray(cache[activeScope]) && cache[activeScope].length) applyFilter();
        });

        // Copy-to-clipboard (event delegation so it survives re-renders).
        rowsEl.addEventListener('click', async (e) => {
            const btn = e.target.closest('.lab-copybtn');
            if (!btn) return;
            const text = btn.dataset.copy;
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(text);
                } else {
                    const ta = document.createElement('textarea');
                    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
                    document.body.appendChild(ta); ta.select();
                    document.execCommand('copy'); document.body.removeChild(ta);
                }
                btn.classList.add('is-copied');
                btn.innerHTML = CHECK;
                setTimeout(() => { btn.classList.remove('is-copied'); btn.innerHTML = COPY; }, 1400);
            } catch { /* clipboard blocked — ignore */ }
        });

        function initPlanner() {
            activateTab('upcoming');
            loadScope('past'); // warm the other tab
        }

        // -----------------------------------------------------------------
        // Password gate — server-enforced. The password is NOT in this
        // page's source. On submit we send the candidate password to the
        // labs feed; the Edge Function verifies it against its LABS_PASSWORD
        // secret and returns 401 if wrong. Only a verified password unlocks
        // the planner and yields Zoom links. The verified password is kept
        // in sessionStorage so leaders aren't re-prompted while navigating,
        // and is replayed on each feed request; clearing it (or a server-
        // side password change) re-locks the page on the next request.
        // -----------------------------------------------------------------
        const GATE_KEY = 'covo-labs-pw';

        const gateEl = document.getElementById('gate');
        const gateForm = document.getElementById('gate-form');
        const gateInput = document.getElementById('gate-input');
        const gateError = document.getElementById('gate-error');
        const gateButton = gateForm.querySelector('button');

        let labsPassword = null;
        try { labsPassword = sessionStorage.getItem(GATE_KEY); } catch { /* private mode */ }

        function lock(msg) {
            labsPassword = null;
            try { sessionStorage.removeItem(GATE_KEY); } catch { /* ignore */ }
            cache.upcoming = undefined;
            cache.past = undefined;
            gateEl.hidden = false;
            gateInput.value = '';
            gateError.textContent = msg || '';
            gateInput.focus();
        }

        async function verifyAndUnlock(candidate) {
            gateButton.disabled = true;
            gateError.textContent = '';
            let res;
            try {
                res = await fetch(buildFeedUrl('upcoming', candidate));
            } catch {
                gateButton.disabled = false;
                gateError.textContent = 'Network error. Try again.';
                return;
            }
            gateButton.disabled = false;
            if (res.status === 401) {
                gateError.textContent = 'Incorrect password. Try again.';
                gateInput.select();
                return;
            }
            if (!res.ok) {
                gateError.textContent = 'Something went wrong. Try again.';
                return;
            }
            // Verified. Persist, seed the upcoming cache from this response
            // (avoids a duplicate fetch), reveal the planner.
            labsPassword = candidate;
            try { sessionStorage.setItem(GATE_KEY, candidate); } catch { /* private mode */ }
            try {
                const data = await res.json();
                cache.upcoming = Array.isArray(data.labs) ? data.labs : [];
            } catch { cache.upcoming = undefined; }
            updateCount('upcoming');
            gateError.textContent = '';
            gateEl.hidden = true;
            initPlanner();
        }

        gateForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const candidate = gateInput.value;
            if (!candidate) { gateError.textContent = 'Enter the password.'; return; }
            verifyAndUnlock(candidate);
        });

        document.addEventListener('DOMContentLoaded', () => {
            if (labsPassword) {
                // Stored password: init immediately. loadScope replays it and
                // re-locks via lock() if the server now rejects it (401).
                initPlanner();
            } else {
                gateEl.hidden = false;
                gateInput.focus();
            }
        });
    </script>

</body>
</html>
